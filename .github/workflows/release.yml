name: Release

# master に push されたとき、manifest.json の version のリリースがまだ無ければ作成する。
# version を上げていない変更（依存更新・CI・ドキュメントなど）では何もしない。
on:
    push:
        branches: ["master"]

# 連続でマージされても、同じ version のリリースを二重に作らない
concurrency:
    group: release
    cancel-in-progress: false

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - name: Read version
              id: version
              run: |
                  VERSION=$(node -p "require('./manifest.json').version")
                  # タグ名に使うため x.y.z 形式（v なし）以外は止める
                  if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                      echo "manifest.json の version が x.y.z 形式ではありません: $VERSION"
                      exit 1
                  fi
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"

            - name: Check existing release
              id: check
              env:
                  GH_TOKEN: ${{ github.token }}
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  if gh release view "$VERSION" >/dev/null 2>&1; then
                      echo "Release $VERSION already exists. Skipping."
                      echo "exists=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "exists=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Verify versions.json
              if: steps.check.outputs.exists == 'false'
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  node -e "
                    const v = process.env.VERSION;
                    const versions = require('./versions.json');
                    const minApp = require('./manifest.json').minAppVersion;
                    if (versions[v] !== minApp) {
                      console.error('versions.json に \"' + v + '\": \"' + minApp + '\" がありません');
                      process.exit(1);
                    }
                  "

            - uses: actions/setup-node@v7
              if: steps.check.outputs.exists == 'false'
              with:
                  node-version: 22.x
                  cache: "npm"

            - name: Build
              if: steps.check.outputs.exists == 'false'
              run: |
                  npm ci
                  npm run build

            - name: Create release
              if: steps.check.outputs.exists == 'false'
              env:
                  GH_TOKEN: ${{ github.token }}
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  gh release create "$VERSION" main.js manifest.json styles.css \
                      --title "$VERSION" \
                      --target "$GITHUB_SHA" \
                      --generate-notes

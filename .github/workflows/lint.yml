name: Node.js build

on:
    push:
        branches: ["**"]
    pull_request:
        branches: ["**"]

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                # 手元の開発環境とリリースのビルドに合わせて 24 系のみで確かめる。
                # Node 22 はサポート終了（2027-04-30）が近いため外した
                node-version: [24.x]
                # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
                  # runner のキャッシュにある古い版ではなく、範囲内の最新版（セキュリティ修正版）を使う
                  check-latest: true
                  cache: "npm"
            - run: npm ci
            - run: npm run build --if-present
            - run: npm run lint
            - run: npm test


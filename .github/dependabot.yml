version: 2
updates:
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "monthly"
      ignore:
          # obsidian は minAppVersion と合わせて手動で上げる
          - dependency-name: "obsidian"
      groups:
          dev-dependencies:
              dependency-type: "development"

    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "monthly"
      groups:
          github-actions:
              patterns:
                  - "*"
